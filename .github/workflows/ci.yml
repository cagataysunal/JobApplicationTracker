name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JobTracker.slnx

      - name: Build
        run: dotnet build JobTracker.slnx --no-restore --configuration Release -warnaserror

      # Integration tests start a SQL Server container through Testcontainers;
      # GitHub's Ubuntu runners ship with Docker, so no extra setup is needed.
      - name: Test
        run: >
          dotnet test JobTracker.slnx --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
